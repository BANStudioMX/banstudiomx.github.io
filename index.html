<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAN Studio - Official Website</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0e12;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #fff;
        }
        .subtitle {
            color: #8a8f98;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .game-card {
            background: #161920;
            border: 1px solid #242936;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00bcd4; /* Color cyan para destacar el juego */
            margin-0: 0 0 10px 0;
        }
        .game-desc {
            color: #b4b9c1;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        footer {
            margin-top: 20px;
        }
        .legal-links a {
            color: #8a8f98;
            text-decoration: none;
            font-size: 0.85rem;
            margin: 0 10px;
            transition: color 0.2s;
        }
        .legal-links a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nombre de la Empresa -->
        <h1>BAN STUDIO</h1>
        <div class="subtitle">Independent Game Development</div>

        <!-- Sección de tu Juego Actual -->
        <div class="game-card">
            <div class="game-title">Abyssal Gate</div>
            <p class="game-desc">Prepare to enter the depths. An intense gaming experience coming soon to mobile devices. Stay tuned for updates and the official release on the app stores.</p>
        </div>

        <!-- Enlaces Legales (¡Ya quedan enlazados perfectamente!) -->
        <footer>
            <div class="legal-links">
                <a href="/privacy.html">Privacy Policy</a>
                <a href="/terms.html">Terms & Conditions</a>
            </div>
        </footer>
    </div>

</body>
</html>
